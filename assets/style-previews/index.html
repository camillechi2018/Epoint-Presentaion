<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新点企业 PPT · 风格预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:32px;background:#f2f5f9;color:#18304d;font-family:"Microsoft YaHei","PingFang SC",sans-serif}main{max-width:1440px;margin:auto}h1{font-size:28px;margin:0 0 8px}p{line-height:1.6}.hint{color:#60738c;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:#fff;border:1px solid #dfe7f0;border-radius:14px;overflow:hidden;box-shadow:0 8px 22px #143d6412}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#eaf0f8}.body{padding:18px}.body h2{font-size:22px;margin:0 0 8px}.body p{font-size:14px;color:#53657d;margin:0}.tag{display:inline-block;border-radius:99px;padding:4px 10px;margin-bottom:12px;font-size:12px;background:#eef4ff;color:#1456ba}.red .tag{background:#fff0f0;color:#aa1616}.tech .tag{background:#e8f3ff;color:#064776}@media(max-width:950px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <h1>选择整套 PPT 的视觉风格</h1>
    <p class="hint">以下是知识库真实页面的缩略图，仅用于预览风格；实际封面、正文和封底仍按材料内容匹配。</p>
    <div class="grid">
      <article class="card blue"><img src="blue.png" alt="蓝白简约目录页预览"><div class="body"><span class="tag">蓝色系</span><h2>蓝白简约</h2><p>日常汇报、经营分析、方案说明</p></div></article>
      <article class="card red"><img src="red.png" alt="红白简约目录页预览"><div class="body"><span class="tag">红色系</span><h2>红白简约</h2><p>正式发布、成果展示、重点项目</p></div></article>
      <article class="card tech"><img src="tech.png" alt="深蓝科技目录页预览"><div class="body"><span class="tag">科技风格</span><h2>深蓝科技</h2><p>技术方案、数字化产品、创新主题</p></div></article>
    </div>
  </main>
</body>
</html>
